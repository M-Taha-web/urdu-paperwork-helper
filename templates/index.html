<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Urdu Paperwork Helper</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    input { width: 70%; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    #result { margin-top: 24px; padding: 16px; background: #f4f4f4; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Paperwork Helper</h1>
  <p>Ask about CNIC, domicile or passport.</p>

  <input id="question" dir="auto" placeholder="e.g. Mujhe naya CNIC banwana hai, kya chahiye?">
  <button onclick="ask()">Ask</button>

  <div id="result"></div>

  <script>
    async function ask() {
      const question = document.getElementById("question").value;
      const response = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question })
      });
      const data = await response.json();
      const box = document.getElementById("result");

      if (!data.found) {
        box.textContent = "Sorry, I could not find that service. Try CNIC, domicile or passport.";
        return;
      }

      const s = data.service;
      const docs = s.documents.map(d => "<li>" + d + "</li>").join("");
      box.innerHTML =
        "<h2>" + s.name_en + "</h2>" +
        "<h2 dir='rtl'>" + s.name_ur + "</h2>" +
        "<b>Documents:</b><ul>" + docs + "</ul>" +
        "<b>Where:</b> " + s.where + "<br>" +
        "<b>Fees:</b> " + s.fees;
    }
  </script>
</body>
</html>
